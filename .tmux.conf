################################################################################
# tmux.conf — Ciprian's Mac config
# MacBook Air 15" M5 · Ghostty · Catppuccin Macchiato
################################################################################

# ── Core ──────────────────────────────────────────────────────────────────────

set -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Tc'
set -as terminal-overrides ',xterm-256color:RGB'
set -as terminal-overrides ',ghostty:RGB'

set -sg escape-time 0             # No ESC delay (important for Neovim)
set -g history-limit 100000
set -g focus-events on            # Needed for Neovim autoread
set -g aggressive-resize on
set -g bell-action none
set -g visual-activity off        # Less noise

# ── Indexing ──────────────────────────────────────────────────────────────────

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Status bar ────────────────────────────────────────────────────────────────

set -g status-position top
set -g status-interval 5
set -g display-time 2000

# ── Mouse & vi mode ───────────────────────────────────────────────────────────

set -g mouse on
setw -g mode-keys vi

# ── Clipboard (macOS pbcopy) ──────────────────────────────────────────────────

set -g set-clipboard on
set -g @copy_to_clipboard 'pbcopy'    # macOS native — no need for wl-copy/xclip

################################################################################
# Prefix & Keybindings
################################################################################

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "✔ tmux.conf reloaded"

# ── Pane navigation (vim-style) ───────────────────────────────────────────────

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Splits (open in current dir) ─────────────────────────────────────────────

unbind %
unbind '"'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind _ split-window -v -c '#{pane_current_path}'   # easier to reach

# ── Pane resize (repeatable) ─────────────────────────────────────────────────

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Window management ────────────────────────────────────────────────────────

bind c new-window -c '#{pane_current_path}'
bind '{' swap-pane -U
bind '}' swap-pane -D

# ── Extras ───────────────────────────────────────────────────────────────────

bind m resize-pane -Z                                                               # Toggle zoom
bind C-y set -w synchronize-panes \; display-message "sync: #{?pane_synchronized,ON,OFF}"

################################################################################
# Copy mode (vi) — macOS clipboard
################################################################################

bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi V   send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi Y   send -X copy-pipe-and-cancel 'pbcopy'

# Don't copy on mouse drag release — select only
unbind -T copy-mode-vi MouseDragEnd1Pane

# Manual buffer copy
bind Y run "tmux save-buffer - | pbcopy" \; display-message '📋 Copied to clipboard'

# ── macOS: fix Cmd+K in Neovim ───────────────────────────────────────────────
bind -n C-l send-keys C-l   # Clear screen passthrough

################################################################################
# Catppuccin Macchiato Theme
################################################################################

set -g @catppuccin_flavor "macchiato"

# Windows
set -g @catppuccin_window_status_style      "rounded"
set -g @catppuccin_window_left_separator    ""
set -g @catppuccin_window_right_separator   ""
set -g @catppuccin_window_middle_separator  "█"
set -g @catppuccin_window_number_position   "right"
set -g @catppuccin_window_default_fill      "number"
set -g @catppuccin_window_default_text      "#W"
set -g @catppuccin_window_current_fill      "number"
set -g @catppuccin_window_current_text      "#W"

# Status modules
set -g @catppuccin_status_left_separator          ""
set -g @catppuccin_status_right_separator         ""
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_connect_separator       "no"
set -g @catppuccin_status_fill                    "icon"
set -g @catppuccin_status_modules_right           "directory session time"
set -g @catppuccin_directory_text                 "#{b:pane_current_path}"   # basename only — less clutter
set -g @catppuccin_time_text                      "%H:%M"
set -g @catppuccin_time_icon                      "󰥔"

################################################################################
# Plugins (TPM)
################################################################################

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Auto-install TPM if missing
if-shell '[ ! -d ~/.config/tmux/plugins/tpm ]' \
  'run-shell "git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && echo TPM installed"'

run-shell '~/.config/tmux/plugins/tpm/tpm'
